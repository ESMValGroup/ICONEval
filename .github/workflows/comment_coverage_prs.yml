---
name: Comment coverage in PRs

permissions:
  pull-requests: write

on:
  pull_request:
    branches:
      - "*"

defaults:
  run:
    shell: pixi run bash -e {0}

jobs:
  comment_coverage_in_prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup environment
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          frozen: true
      - name: Run tests
        run: |
          pytest -n 2 --junitxml=pytest.xml --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered --cov=iconeval tests/
      - name: Comment coverage
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        with:
          coverage-path-prefix: src/iconeval/
          junitxml-path: ./pytest.xml
          pytest-xml-coverage-path: ./coverage.xml
